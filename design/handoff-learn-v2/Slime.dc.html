<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg viewBox="0 -9 100 109" width="100%" height="100%" style="display:block">
<ellipse cx="14" cy="66" rx="11" ry="9" fill="#51CFA0"></ellipse>
<ellipse cx="86" cy="66" rx="11" ry="9" fill="#51CFA0"></ellipse>
<path d="M50 22 C48 12 54 0 62 -1 C67 6.5 60 14 56 22 Z" fill="#51CFA0"></path>
<path d="M50 12 C33 12 22 26 20 46 C18 62 14 74 22 82 C30 90 70 90 78 82 C86 74 82 62 80 46 C78 26 67 12 50 12 Z" fill="#51CFA0"></path>
<ellipse cx="50" cy="71" rx="17" ry="12" fill="#B1EDD4"></ellipse>
<sc-if value="{{ isIdle }}">
<g><ellipse cx="38" cy="50" rx="7" ry="8" fill="#101820"></ellipse><ellipse cx="62" cy="50" rx="7" ry="8" fill="#101820"></ellipse><path d="M45 62 Q50 67 55 62" stroke="#101820" strokeWidth="3" fill="none" strokeLinecap="round"></path></g>
</sc-if>
<sc-if value="{{ isDeadpan }}">
<g><ellipse cx="38" cy="50" rx="7" ry="8" fill="#101820"></ellipse><ellipse cx="62" cy="50" rx="7" ry="8" fill="#101820"></ellipse><path d="M45 63 L55 63" stroke="#101820" strokeWidth="3" fill="none" strokeLinecap="round"></path></g>
</sc-if>
<sc-if value="{{ isJudging }}">
<g><ellipse cx="38" cy="50" rx="7" ry="8" fill="#101820"></ellipse><ellipse cx="62" cy="50" rx="7" ry="8" fill="#101820"></ellipse><rect x="30" y="40" width="16" height="7" fill="#51CFA0"></rect><rect x="54" y="40" width="16" height="7" fill="#51CFA0"></rect><path d="M44 63 L56 61" stroke="#101820" strokeWidth="3" fill="none" strokeLinecap="round"></path></g>
</sc-if>
<sc-if value="{{ isDelight }}">
<g><path d="M32 51 Q38 43 44 51" stroke="#101820" strokeWidth="4" fill="none" strokeLinecap="round"></path><path d="M56 51 Q62 43 68 51" stroke="#101820" strokeWidth="4" fill="none" strokeLinecap="round"></path><path d="M43 60 Q50 70 57 60 Z" fill="#101820"></path></g>
</sc-if>
<sc-if value="{{ isSleep }}">
<g><path d="M32 50 Q38 57 44 50" stroke="#101820" strokeWidth="4" fill="none" strokeLinecap="round"></path><path d="M56 50 Q62 57 68 50" stroke="#101820" strokeWidth="4" fill="none" strokeLinecap="round"></path><ellipse cx="50" cy="63" rx="3" ry="3.5" fill="#101820"></ellipse></g>
</sc-if>
<sc-if value="{{ isSurprised }}">
<g><circle cx="38" cy="49" r="9" fill="#101820"></circle><circle cx="62" cy="49" r="9" fill="#101820"></circle><ellipse cx="50" cy="65" rx="4.5" ry="5.5" fill="#101820"></ellipse></g>
</sc-if>
<sc-if value="{{ isSad }}">
<g><ellipse cx="38" cy="52" rx="7" ry="8" fill="#101820"></ellipse><ellipse cx="62" cy="52" rx="7" ry="8" fill="#101820"></ellipse><path d="M30 40 L45 44" stroke="#101820" strokeWidth="3" fill="none" strokeLinecap="round"></path><path d="M70 40 L55 44" stroke="#101820" strokeWidth="3" fill="none" strokeLinecap="round"></path><path d="M45 66 Q50 61 55 66" stroke="#101820" strokeWidth="3" fill="none" strokeLinecap="round"></path></g>
</sc-if>
<sc-if value="{{ isFocused }}">
<g><ellipse cx="38" cy="52" rx="7" ry="8" fill="#101820"></ellipse><ellipse cx="62" cy="52" rx="7" ry="8" fill="#101820"></ellipse><path d="M30 41 L45 39" stroke="#101820" strokeWidth="3" fill="none" strokeLinecap="round"></path><path d="M70 41 L55 39" stroke="#101820" strokeWidth="3" fill="none" strokeLinecap="round"></path><path d="M45 64 L55 64" stroke="#101820" strokeWidth="3" fill="none" strokeLinecap="round"></path></g>
</sc-if>
<sc-if value="{{ isWink }}">
<g><ellipse cx="38" cy="50" rx="7" ry="8" fill="#101820"></ellipse><path d="M56 51 Q62 44 68 51" stroke="#101820" strokeWidth="4" fill="none" strokeLinecap="round"></path><path d="M44 61 Q50 68 56 61" stroke="#101820" strokeWidth="3.5" fill="none" strokeLinecap="round"></path></g>
</sc-if>
<sc-if value="{{ hasBlush }}">
<g><ellipse cx="26" cy="60" rx="5.5" ry="3.5" fill="#FF9E94" opacity="0.85"></ellipse><ellipse cx="74" cy="60" rx="5.5" ry="3.5" fill="#FF9E94" opacity="0.85"></ellipse></g>
</sc-if>
<sc-if value="{{ hasCrown }}">
<g><path d="M31 14 L34 5.5 L39 11 L44 3 L49 11 L54 5.5 L57 14 Z" fill="#FFC24B"></path></g>
</sc-if>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:160},&quot;face&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;deadpan&quot;,&quot;judging&quot;,&quot;delight&quot;,&quot;sleep&quot;,&quot;surprised&quot;,&quot;sad&quot;,&quot;focused&quot;,&quot;wink&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;level&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:1,&quot;max&quot;:3,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const f = this.props.face || 'idle';
    const lv = this.props.level || 1;
    return {
      isIdle: f === 'idle', isDeadpan: f === 'deadpan', isJudging: f === 'judging',
      isDelight: f === 'delight', isSleep: f === 'sleep', isSurprised: f === 'surprised',
      isSad: f === 'sad', isFocused: f === 'focused', isWink: f === 'wink',
      hasBlush: lv >= 2, hasCrown: lv >= 3
    };
  }
}
</script>
</body>
</html>
