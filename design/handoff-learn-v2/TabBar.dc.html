<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;left:0;right:0;bottom:0;height:170px;background:linear-gradient(to top,#FAF5EC 42%,rgba(250,245,236,0.92) 68%,rgba(250,245,236,0));pointer-events:none"></div>
<div style="position:absolute;left:22px;right:22px;bottom:26px;display:flex;align-items:center;gap:10px">
<div style="flex:1;height:62px;background:#2E2622;border-radius:999px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;box-sizing:border-box">
<div style="width:46px;height:46px;border-radius:15px;display:grid;place-items:center;position:relative">
<sc-if value="{{ aHome }}"><div style="position:absolute;inset:0;background:#FF6F61;border-radius:15px"></div></sc-if>
<svg width="23" height="23" viewBox="0 0 24 24" style="position:relative"><path d="M12 3.2 3.5 10.6V20a1 1 0 0 0 1 1h5v-6h5v6h5a1 1 0 0 0 1-1v-9.4L12 3.2Z" fill="{{ cHome }}"></path></svg>
</div>
<div style="width:46px;height:46px;border-radius:15px;display:grid;place-items:center;position:relative">
<sc-if value="{{ aFocus }}"><div style="position:absolute;inset:0;background:#FF6F61;border-radius:15px"></div></sc-if>
<svg width="23" height="23" viewBox="0 0 24 24" style="position:relative"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 4.6v5.9l4.2 2.4-1 1.7-5.2-3V6.6h2Z" fill="{{ cFocus }}"></path></svg>
</div>
<div style="width:46px;height:46px;border-radius:15px;display:grid;place-items:center;position:relative">
<sc-if value="{{ aGames }}"><div style="position:absolute;inset:0;background:#FF6F61;border-radius:15px"></div></sc-if>
<svg width="23" height="23" viewBox="0 0 24 24" style="position:relative"><path d="M7.5 7h9a5.5 5.5 0 0 1 5.5 5.5v.8a3.7 3.7 0 0 1-6.6 2.3l-.7-.9h-5.4l-.7.9A3.7 3.7 0 0 1 2 13.3v-.8A5.5 5.5 0 0 1 7.5 7Zm-.6 3.1v1.5H5.4v1.5h1.5v1.5h1.5v-1.5h1.5v-1.5H8.4v-1.5H6.9Zm8.9.4a1 1 0 1 0 0 2 1 1 0 0 0 0-2Zm2.2 2.2a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z" fill="{{ cGames }}"></path></svg>
</div>
<div style="width:46px;height:46px;border-radius:15px;display:grid;place-items:center;position:relative">
<sc-if value="{{ aLearn }}"><div style="position:absolute;inset:0;background:#FF6F61;border-radius:15px"></div></sc-if>
<svg width="23" height="23" viewBox="0 0 24 24" style="position:relative"><path d="M2.4 6c3.1-1.4 6.6-1.2 9.6.6 3-1.8 6.5-2 9.6-.6v11.7c-3.1-1.4-6.6-1.2-9.6.6-3-1.8-6.5-2-9.6-.6V6Z" fill="{{ cLearn }}"></path></svg>
</div>
<div style="width:46px;height:46px;border-radius:15px;display:grid;place-items:center;position:relative">
<sc-if value="{{ aFriends }}"><div style="position:absolute;inset:0;background:#FF6F61;border-radius:15px"></div></sc-if>
<svg width="23" height="23" viewBox="0 0 24 24" style="position:relative"><path d="M9 11.2a3.6 3.6 0 1 0 0-7.2 3.6 3.6 0 0 0 0 7.2Zm7.2-.4a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM2.4 19.2c0-3 3-4.9 6.6-4.9s6.6 1.9 6.6 4.9V20H2.4v-.8Zm14.5.8v-.8c0-1.7-.6-3.1-1.7-4.2 3.2.1 5.6 1.9 5.6 4.1V20h-3.9Z" fill="{{ cFriends }}"></path></svg>
</div>
</div>
<div style="width:62px;height:62px;border-radius:999px;background:#FAF5EC;box-shadow:0 0 0 3px #FFFFFF, 0 2px 8px rgba(46,38,34,.18);display:grid;place-items:center;overflow:hidden">
<dc-import name="Slime" face="idle" level="{{ avatarLevel }}" hint-size="46px,46px" style="width:46px;height:46px;margin-top:8px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:170},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;focus&quot;,&quot;games&quot;,&quot;learn&quot;,&quot;friends&quot;],&quot;default&quot;:&quot;learn&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;avatarLevel&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:1,&quot;max&quot;:3,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'learn';
    const on = '#FFF6EF', off = '#8B7F79';
    return {
      aHome: a === 'home', aFocus: a === 'focus', aGames: a === 'games',
      aLearn: a === 'learn', aFriends: a === 'friends',
      cHome: a === 'home' ? on : off, cFocus: a === 'focus' ? on : off,
      cGames: a === 'games' ? on : off, cLearn: a === 'learn' ? on : off,
      cFriends: a === 'friends' ? on : off,
      avatarLevel: this.props.avatarLevel ?? 3
    };
  }
}
</script>
</body>
</html>
