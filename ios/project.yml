name: PrepkinCanvas
options:
  bundleIdPrefix: com.prepkin
  deploymentTarget:
    iOS: "17.0"
targets:
  PrepkinCanvas:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prepkin.canvas
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
  PrepkinCanvasTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PrepkinCanvas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prepkin.canvas.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
schemes:
  PrepkinCanvas:
    build:
      targets:
        PrepkinCanvas: all
        PrepkinCanvasTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [PrepkinCanvasTests]
