name: PrepkinCanvas
options:
  bundleIdPrefix: com.prepkin
  deploymentTarget:
    iOS: "17.0"
targets:
  PrepkinCanvas:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      # Shared with the Live Activity extension. Only the attributes live here —
      # the shape of what the lock screen is told.
      - Shared
      # Folder reference, not a group: the built Sprout page loads its assets by
      # relative path (./assets/...), so the directory has to survive into the
      # bundle instead of being flattened like Resources/ is.
      - path: SproutWeb
        type: folder
    dependencies:
      - target: PrepkinActivity
        embed: true
    # The app group the widget and the Done button write to. `AppGroup.swift` says
    # what lives there. The file is generated here; do not hand-edit it.
    entitlements:
      path: PrepkinCanvas.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.prepkin.canvas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prepkin.canvas
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Light only, app-wide. The paper, tank plates and kin art are tuned for
        # cream; a real dark paper is a queued handoff, not a token swap. This key
        # also reaches UIKit-hosted views and the web view, which
        # .preferredColorScheme never did.
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_CFBundleDisplayName: "Prepkin for Canvas"
        # The lock screen and Dynamic Island for a running shift. Without this key
        # `Activity.request` throws and the shift runs with nothing outside the app.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        # Every upload asks the export question unless this says no. We only use
        # the system's TLS, which is exempt.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # The syllabus scanner. Both strings are what the system permission
        # sheet shows, so they say what happens to the photo.
        INFOPLIST_KEY_NSCameraUsageDescription: "To read a syllabus or planner page into your calendar. The photo is read once and not kept."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "To pick a photo of a syllabus or planner page to read into your calendar."
        # Sending dated work out to Apple Calendar. Write-only on purpose: Prepkin
        # adds events and never reads what is already in the calendar, and this is
        # the key that asks for exactly that and nothing more.
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: "To add your dated work to your calendar. Prepkin adds events and never reads what is already there."
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: FLN528LLJ6
  # The Live Activity, and only that. Home-screen widgets are their own job: they
  # would need the save file and an app group, and this needs neither.
  PrepkinActivity:
    type: app-extension
    platform: iOS
    sources:
      - Activity
      - Shared
      # The same tokens the app draws with, so the paper and the coin gold on the
      # lock screen cannot drift from the paper and the coin gold in the tab.
      - path: Sources/Theme.swift
    # A real plist, not GENERATE_INFOPLIST_FILE. `NSExtensionPointIdentifier` is a
    # nested key, and the generated plist dropped it silently — which builds a
    # perfectly good extension that iOS never loads.
    info:
      path: Activity/Info.plist
      properties:
        CFBundleDisplayName: Prepkin
        UIUserInterfaceStyle: Light
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prepkin.canvas.activity
        PRODUCT_NAME: PrepkinActivity
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: FLN528LLJ6

  PrepkinCanvasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      # `SKTestSession` loads the config out of the test bundle, so the same file the
      # scheme runs the app against is the file the purchase tests buy from. One
      # source of truth for the products and the prices.
      - path: PrepkinCanvas.storekit
        buildPhase: resources
    dependencies:
      - target: PrepkinCanvas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prepkin.canvas.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
schemes:
  PrepkinCanvas:
    build:
      targets:
        PrepkinCanvas: all
        PrepkinCanvasTests: [test]
    run:
      config: Debug
      storeKitConfiguration: PrepkinCanvas.storekit
      # On by default so a Run on the phone comes up with the whole catalogue open. It is
      # DEBUG-only and read from ProcessInfo, so a Release or TestFlight build ignores it
      # entirely. Untick it in Product > Scheme > Edit Scheme to see the real save instead.
      commandLineArguments:
        "-unlockAll": true
    test:
      config: Debug
      targets: [PrepkinCanvasTests]
